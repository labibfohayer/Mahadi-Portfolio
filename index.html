<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/svgs/weichie-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mahadi Hasan - Portfolio</title>
    <meta name="description" content="Mahadi Hasan - Video Editor & Graphic Designer Portfolio. Jigarthala, Dhanmondi, Dhaka, Bangladesh." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Hind+Siliguri:wght@500;600;700&family=Noto+Serif+Bengali:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/weichie-main.css" />
    <style>
      @font-face {
        font-family: 'Fustat';
        src: url('/fonts/fustat-latin-500-normal-beURfYU3.woff2') format('woff2');
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Fustat';
        src: url('/fonts/fustat-latin-700-normal-aqWGUdpP.woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Season Mix';
        src: url('/fonts/season-mix-medium-gS90wozr.woff2') format('woff2');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
      :root {
        --clr-primary: #ff4f31;
        --border-radius-default: 16px;
      }
      body {
        background-color: var(--clr-bg, #fdf9f9);
        color: var(--clr-text, #111111);
        font-family: 'Fustat', system-ui, -apple-system, sans-serif;
        overflow-x: hidden;
        transition: background-color 0.3s ease, color 0.3s ease;
      }
    </style>
  </head>
  <body class="bg-[var(--clr-bg,#fdf9f9)] text-[var(--clr-text,#111111)] selection:bg-[#ff4f31] selection:text-white antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
